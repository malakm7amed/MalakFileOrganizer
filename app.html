<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriHub</title>

<link rel="icon" type="image/png" href="agrihub-icon-512.png">
<link rel="apple-touch-icon" href="agrihub-icon-512.png">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#172033">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 30px 20px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    opacity: 0.8;
}

.container {
    width: 90%;
    max-width: 700px;
    margin: 30px auto;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.card {
    border: none;
    background: white;
    color: #172033;
    padding: 28px 12px;
    border-radius: 18px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    cursor: pointer;
}

.card:active {
    transform: scale(0.97);
}

.back {
    border: none;
    background: #172033;
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    margin-bottom: 20px;
    cursor: pointer;
    font-weight: bold;
}

.hidden {
    display: none;
}

.message {
    background: white;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

footer {
    text-align: center;
    color: #888;
    padding: 30px;
}

</style>
</head>

<body>

<header>

<h1>📚 AgriHub</h1>

<p>Your university materials in one place</p>

</header>


<!-- ================= HOME ================= -->

<div class="container" id="home">

<h2 class="title">Choose your Section</h2>

<div class="grid">

<button class="card" onclick="showSubjects()">
📚 Section 1 → 6
</button>

</div>

</div>


<!-- ================= SUBJECTS ================= -->

<div class="container hidden" id="subjects">

<button class="back" onclick="goHome()">
← Back
</button>

<h2 class="title">Section 1 → 6 • Subjects</h2>

<div class="grid">

<button class="card" onclick="showSubject('Botany')">
🌱 Botany
</button>

<button class="card" onclick="showSubject('Organic Agriculture')">
🌾 Organic Agriculture
</button>

<button class="card" onclick="showSubject('Mathematics')">
📐 Mathematics
</button>

<button class="card" onclick="showSubject('English')">
🇬🇧 English
</button>

<button class="card" onclick="showSubject('Economics')">
💰 Economics
</button>

<button class="card" onclick="showSubject('Quality')">
✅ Quality
</button>

</div>

</div>


<!-- ================= MATERIALS ================= -->

<div class="container hidden" id="materials">

<button class="back" onclick="backToSubjects()">
← Back
</button>

<h2 class="title" id="subjectTitle"></h2>

<div class="grid">

<button class="card" onclick="openMaterial('Lectures')">
📚 Lectures
</button>

<button class="card" onclick="openMaterial('Sections')">
👩‍🏫 Sections
</button>

<button class="card" onclick="openMaterial('Assignments')">
📝 Assignments
</button>

</div>

</div>


<!-- ================= CONTENT ================= -->

<div class="container hidden" id="content">

<button class="back" onclick="backToMaterials()">
← Back
</button>

<h2 class="title" id="contentTitle"></h2>

<div class="message">

<p>
🚧 Materials will be added here.
</p>

</div>

</div>


<footer>
Made for students ❤️
</footer>


<script>

let currentSubject = "";


/* SECTION → SUBJECTS */

function showSubjects() {

document.getElementById("home").classList.add("hidden");

document.getElementById("content").classList.add("hidden");

document.getElementById("materials").classList.add("hidden");

document.getElementById("subjects").classList.remove("hidden");

}


/* SUBJECT */

function showSubject(subject) {

currentSubject = subject;

document.getElementById("subjects").classList.add("hidden");

document.getElementById("content").classList.add("hidden");

document.getElementById("materials").classList.remove("hidden");

document.getElementById("subjectTitle").innerText =
"Section 1 → 6 • " + subject;

}


/* MATERIAL */

function openMaterial(type) {

document.getElementById("materials").classList.add("hidden");

document.getElementById("content").classList.remove("hidden");

document.getElementById("contentTitle").innerText =
"Section 1 → 6 • " +
currentSubject +
" • " +
type;

}


/* HOME */

function goHome() {

document.getElementById("subjects").classList.add("hidden");

document.getElementById("materials").classList.add("hidden");

document.getElementById("content").classList.add("hidden");

document.getElementById("home").classList.remove("hidden");

}


/* SUBJECTS */

function backToSubjects() {

document.getElementById("materials").classList.add("hidden");

document.getElementById("content").classList.add("hidden");

document.getElementById("subjects").classList.remove("hidden");

}


/* MATERIALS */

function backToMaterials() {

document.getElementById("content").classList.add("hidden");

document.getElementById("materials").classList.remove("hidden");

}

</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
    });
}
</script>
</body>
    </html>
