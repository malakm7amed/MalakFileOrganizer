<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriHub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 32px 20px;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 8px 0 0;
    opacity: .8;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: 30px auto;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.card {
    display: block;
    background: white;
    color: #172033;
    text-decoration: none;
    padding: 30px 15px;
    border-radius: 18px;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    box-shadow: 0 5px 18px rgba(0,0,0,.08);
    cursor: pointer;
    border: none;
    width: 100%;
}

.card:active {
    transform: scale(.97);
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: #172033;
    font-weight: bold;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media (max-width: 600px) {
    .grid {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 AgriHub</h1>
    <p>Your university materials in one place</p>
</header>


<!-- HOME -->
<div class="container" id="home">

    <h2>Choose your Section</h2>

    <div class="grid">

        <button class="card" onclick="showSection(1)">📘 Section 1</button>
        <button class="card" onclick="showSection(2)">📗 Section 2</button>
        <button class="card" onclick="showSection(3)">📙 Section 3</button>
        <button class="card" onclick="showSection(4)">📕 Section 4</button>
        <button class="card" onclick="showSection(5)">📒 Section 5</button>
        <button class="card" onclick="showSection(6)">📓 Section 6</button>

    </div>

</div>


<!-- SUBJECTS -->
<div class="container hidden" id="subjects">

    <a class="back" href="#" onclick="goHome()">← Back</a>

    <h2 id="sectionTitle">Section</h2>

    <div class="grid">

        <button class="card" onclick="showSubject('Botany')">
            🌱 Botany
        </button>

        <button class="card" onclick="showSubject('Organic Chemistry')">
            🧪 Organic Chemistry
        </button>

        <button class="card" onclick="showSubject('Mathematics')">
            📐 Mathematics
        </button>

        <button class="card" onclick="showSubject('English')">
            🇬🇧 English
        </button>

        <button class="card" onclick="showSubject('Economics')">
            💰 Economics
        </button>

        <button class="card" onclick="showSubject('Quality')">
            ✅ Quality
        </button>

    </div>

</div>


<!-- MATERIAL TYPES -->
<div class="container hidden" id="materials">

    <a class="back" href="#" onclick="backToSubjects()">← Back to Subjects</a>

    <h2 id="subjectTitle">Subject</h2>

    <div class="grid">

        <button class="card" onclick="openMaterial('Lectures')">
            📚 Lectures
        </button>

        <button class="card" onclick="openMaterial('Assignments')">
            📝 Assignments
        </button>

        <button class="card" onclick="openMaterial('Sections')">
            👩‍🏫 Sections
        </button>

    </div>

</div>


<!-- CONTENT -->
<div class="container hidden" id="content">

    <a class="back" href="#" onclick="backToMaterials()">← Back</a>

    <h2 id="contentTitle"></h2>

    <div class="card">
        🚧
        <br><br>
        Materials will be added here.
    </div>

</div>


<footer>
    Made for students ❤️
</footer>


<script>

let currentSection = 1;
let currentSubject = "";


/* SECTION */
function showSection(sectionNumber) {

    currentSection = sectionNumber;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("materials").classList.add("hidden");
    document.getElementById("content").classList.add("hidden");

    document.getElementById("subjects").classList.remove("hidden");

    document.getElementById("sectionTitle").innerText =
        "Section " + sectionNumber;
}


/* SUBJECT */
function showSubject(subject) {

    currentSubject = subject;

    document.getElementById("subjects").classList.add("hidden");
    document.getElementById("content").classList.add("hidden");

    document.getElementById("materials").classList.remove("hidden");

    document.getElementById("subjectTitle").innerText =
        "Section " + currentSection + " • " + subject;
}


/* MATERIAL */
function openMaterial(type) {

    document.getElementById("materials").classList.add("hidden");

    document.getElementById("content").classList.remove("hidden");

    document.getElementById("contentTitle").innerText =
        "Section " + currentSection +
        " • " +
        currentSubject +
        " • " +
        type;
}


/* HOME */
function goHome() {

    document.getElementById("subjects").classList.add("hidden");
    document.getElementById("materials").classList.add("hidden");
    document.getElementById("content").classList.add("hidden");

    document.getElementById("home").classList.remove("hidden");
}


/* BACK TO SUBJECTS */
function backToSubjects() {

    document.getElementById("materials").classList.add("hidden");
    document.getElementById("content").classList.add("hidden");

    document.getElementById("subjects").classList.remove("hidden");
}


/* BACK TO MATERIALS */
function backToMaterials() {

    document.getElementById("content").classList.add("hidden");
    document.getElementById("materials").classList.remove("hidden");
}

</script>

</body>
</html>
