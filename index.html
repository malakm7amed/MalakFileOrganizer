<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriHub</title>

<link rel="icon" type="image/png" href="agrihub-icon-512.png">
<link rel="apple-touch-icon" href="agrihub-icon-512.png">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#172033">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 10px 0 0;
    opacity: 0.8;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: 35px auto;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.card {
    text-decoration: none;
    background: white;
    color: #172033;
    padding: 32px 15px;
    border-radius: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card:active {
    transform: scale(0.97);
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>📚 AgriHub</h1>
    <p>Your university materials in one place</p>
</header>

<div class="container">

    <h2 class="title">Choose your Section</h2>

    <div class="grid">

        <a class="card" href="section1.html">📘 Section 1</a>

        <a class="card" href="section2.html">📗 Section 2</a>

        <a class="card" href="section3.html">📙 Section 3</a>

        <a class="card" href="section4.html">📕 Section 4</a>

        <a class="card" href="section5.html">📒 Section 5</a>

        <a class="card" href="section6.html">📓 Section 6</a>

    </div>

</div>

<footer>
    Made for students ❤️
</footer>

</body>
    </html>
