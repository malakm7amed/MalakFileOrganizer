<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriHub</title>

<!-- App Icon -->
<link rel="icon" type="image/png" href="agrihub-icon-512.png">
<link rel="apple-touch-icon" href="agrihub-icon-512.png">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Mobile App Settings -->
<meta name="theme-color" content="#172033">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AgriHub">


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 6px;
    opacity: 0.75;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 25px 18px;
}

.title {
    margin-bottom: 18px;
    font-size: 22px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

button {
    border: none;
    border-radius: 15px;
    padding: 20px 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: #172033;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

.section-btn {
    min-height: 85px;
}

.subject-btn {
    min-height: 70px;
}

.back {
    background: #172033;
    color: white;
    margin-bottom: 20px;
    padding: 12px 20px;
}

.hidden {
    display: none;
}

.materials {
    display: grid;
    gap: 14px;
}

.material {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.material h3 {
    margin-bottom: 7px;
}

.material p {
    color: #687386;
    margin-bottom: 12px;
}

.material a {
    display: inline-block;
    text-decoration: none;
    background: #172033;
    color: white;
    padding: 9px 15px;
    border-radius: 9px;
}

footer {
    text-align: center;
    color: #8a93a3;
    padding: 30px 10px;
}

</style>

</head>


<body>

<header>

    <h1>📚 AgriHub</h1>

    <p>Your university materials in one place</p>

</header>


<div class="container">


    <!-- SECTIONS -->

    <div id="sectionsPage">

        <h2 class="title">Choose your Section</h2>

        <div class="grid">

            <button
                class="section-btn"
                onclick="showSubjects(1)">
                Section 1
            </button>

            <button
                class="section-btn"
                onclick="showSubjects(2)">
                Section 2
            </button>

            <button
                class="section-btn"
                onclick="showSubjects(3)">
                Section 3
            </button>

            <button
                class="section-btn"
                onclick="showSubjects(4)">
                Section 4
            </button>

            <button
                class="section-btn"
                onclick="showSubjects(5)">
                Section 5
            </button>

            <button
                class="section-btn"
                onclick="showSubjects(6)">
                Section 6
            </button>

        </div>

    </div>


    <!-- SUBJECTS -->

    <div id="subjectsPage" class="hidden">
